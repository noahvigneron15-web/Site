<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Orbistral · Dashboard</title>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* =========================================================
           ORBISTRAL design system — deep-space console
           ========================================================= */
        :root {
            --radius: 1.1rem;
            --radius-sm: calc(var(--radius) - 4px);
            --radius-md: calc(var(--radius) - 2px);
            --radius-lg: var(--radius);
            --radius-xl: calc(var(--radius) + 4px);
            --radius-2xl: calc(var(--radius) + 8px);

            --background: #0a0a0a;
            --foreground: oklch(0.96 0.012 260);
            --card: oklch(0.19 0.045 268 / 0.72);
            --card-foreground: oklch(0.96 0.012 260);
            --primary: oklch(0.72 0.16 232);
            --primary-foreground: oklch(0.15 0.04 265);
            --secondary: oklch(0.26 0.05 268);
            --secondary-foreground: oklch(0.94 0.015 260);
            --muted: oklch(0.24 0.045 268);
            --muted-foreground: oklch(0.68 0.035 265);
            --accent: oklch(0.58 0.2 275);
            --accent-foreground: oklch(0.98 0.01 260);
            --destructive: oklch(0.64 0.22 15);
            --destructive-foreground: oklch(0.98 0.01 260);
            --border: oklch(0.72 0.12 260 / 0.16);
            --input: oklch(0.72 0.12 260 / 0.2);
            --ring: oklch(0.72 0.16 232);
            --gold: oklch(0.85 0.16 88);
            --gold-foreground: oklch(0.2 0.05 60);
            --success: oklch(0.78 0.17 160);
            --cyan: oklch(0.82 0.14 205);
            --nebula: oklch(0.62 0.24 320);

            --orb-size: 220px;
            --orb-glow: rgba(0, 210, 255, 0.55);
            --bg-deep: #02030a;
            --glass: rgba(7, 10, 31, 0.67);
            --border-glass: rgba(120, 140, 255, 0.12);
            --text-soft: #858dac;
            --text-bright: #eef1ff;
            --accent: #3e68ff;
            --accent-cyan: #17c8f2;
            --accent-pink: #ff31db;
            --radius-lg: 22px;
            --radius-md: 13px;
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100vh;
            background: var(--background);
            font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
            color: var(--foreground);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ---------------------------------------------------------
           STARFIELD - animées mais pas robotiques
           --------------------------------------------------------- */
        .starfield {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 72% 12%, oklch(0.5 0.2 275 / 0.35), transparent 42%),
                radial-gradient(circle at 12% 78%, oklch(0.7 0.15 205 / 0.22), transparent 40%),
                radial-gradient(circle at 50% 120%, oklch(0.7 0.18 330 / 0.18), transparent 45%),
                radial-gradient(circle at 88% 32%, oklch(0.6 0.22 320 / 0.25), transparent 38%),
                linear-gradient(160deg, oklch(0.08 0.025 265), oklch(0.14 0.05 270) 45%, oklch(0.07 0.025 265));
            animation: pulse-glow 10s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% {
                opacity: 0.85;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.02);
            }
        }

        /* Neon particles effect */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(0, 238, 255, 0.8);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0, 238, 255, 1), 0 0 30px rgba(0, 150, 255, 0.5);
            animation: float 20s infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0) scale(0);
                opacity: 0;
            }
            5% {
                transform: translateY(0) translateX(0) scale(1);
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(100px) scale(0.5);
                opacity: 0;
            }
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--dur, 4s) ease-in-out infinite;
            animation-delay: var(--delay, 0s);
            opacity: 0.5;
            box-shadow: 0 0 6px rgba(255, 255, 255, 1), 0 0 12px rgba(100, 150, 255, 0.6), 0 0 20px rgba(0, 238, 255, 0.3);
        }

        @keyframes twinkle {
            0%,
            100% {
                opacity: 0.3;
                transform: scale(0.5);
            }
            25% {
                opacity: 1;
                transform: scale(1.2);
            }
            50% {
                opacity: 0.6;
                transform: scale(0.8);
            }
            75% {
                opacity: 0.9;
                transform: scale(1.1);
            }
        }

        /* ---------------------------------------------------------
           DASHBOARD LAYOUT
           --------------------------------------------------------- */
        .dashboard-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 0;
        }

        .main-content {
            flex: 1;
            padding: 40px 60px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 80px;
            padding: 35px 50px;
            background: linear-gradient(135deg, rgba(7, 10, 31, 0.8), rgba(3, 5, 20, 0.7));
            border: 1px solid rgba(120, 140, 255, 0.15);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 
                0 25px 60px rgba(0, 0, 0, .5), 
                0 0 50px rgba(51, 74, 255, .1),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(0, 238, 255, 0.03), transparent, rgba(255, 49, 219, 0.03), transparent);
            animation: headerRotate 20s linear infinite;
        }

        @keyframes headerRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .header-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
        }

        .header h1 {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #eef1ff 0%, #3e68ff 30%, #17c8f2 60%, #ff31db 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
            letter-spacing: -2px;
            text-shadow: 0 0 40px rgba(0, 238, 255, 0.3);
            animation: titleGlow 3s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.2); }
        }

        .header-sub {
            font-size: 18px;
            color: var(--text-soft);
            margin: 12px 0 0 0;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .btn-logout {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 28px;
            background: linear-gradient(135deg, rgba(255, 65, 65, 0.2), rgba(255, 100, 100, 0.15));
            border: 1px solid rgba(255, 65, 65, 0.4);
            border-radius: 14px;
            color: #ff6565;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            overflow: hidden;
        }

        .btn-logout::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }

        .btn-logout:hover::before {
            transform: translateX(100%);
        }

        .btn-logout:hover {
            background: linear-gradient(135deg, rgba(255, 65, 65, 0.35), rgba(255, 100, 100, 0.25));
            border-color: rgba(255, 65, 65, 0.6);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 40px rgba(255, 65, 65, 0.3);
        }

        .btn-logout:active {
            transform: translateY(-1px) scale(0.98);
        }

        /* MAIN CONTENT */
        .main-content {
            flex: 1;
            max-width: 1080px;
            margin: 0 auto;
            padding: 54px 48px 70px;
            animation: rise 0.7s var(--ease-out-expo) both;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(22px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* STATS SIMPLE - ORB CENTERED */
        .stats-simple {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 50px;
            padding: 80px 20px;
            position: relative;
        }

        .stat-doall-text {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #eef1ff 0%, #3e68ff 25%, #17c8f2 50%, #ff31db 75%, #eef1ff 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
            text-transform: uppercase;
            animation: gradientShift 4s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% center; }
            50% { background-position: 100% center; }
            100% { background-position: 0% center; }
        }

        .stat-orb {
            position: relative;
            width: var(--orb-size);
            height: var(--orb-size);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.8s var(--ease-out-expo);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: orbFloat 6s ease-in-out infinite;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .stat-orb:hover {
            transform: scale(1.15) translateY(-10px);
            animation: none;
        }

        .stat-orb.center {
            background: radial-gradient(circle at 30% 30%, rgba(0, 238, 255, 0.5), rgba(0, 150, 255, 0.3), rgba(255, 49, 219, 0.2));
            box-shadow: 
                0 0 80px rgba(0, 238, 255, 0.5),
                0 0 150px rgba(0, 150, 255, 0.3),
                0 0 220px rgba(255, 49, 219, 0.2),
                inset 0 0 80px rgba(0, 238, 255, 0.3);
        }

        .stat-orb:hover.center {
            box-shadow: 
                0 0 100px rgba(0, 238, 255, 0.7),
                0 0 180px rgba(0, 150, 255, 0.5),
                0 0 260px rgba(255, 49, 219, 0.3),
                inset 0 0 100px rgba(0, 238, 255, 0.4);
        }

        .stat-facet {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            opacity: 0.7;
            transition: all 0.8s var(--ease-out-expo);
            animation: facetRotate 20s linear infinite;
        }

        .stat-orb:hover .stat-facet {
            opacity: 1;
            animation-duration: 10s;
        }

        .facet-1 {
            background: linear-gradient(135deg, rgba(0, 238, 255, 0.4), rgba(0, 150, 255, 0.2));
            transform: rotate(0deg);
            animation-delay: 0s;
        }

        .facet-2 {
            background: linear-gradient(180deg, rgba(0, 200, 255, 0.4), rgba(0, 150, 255, 0.2));
            transform: rotate(45deg);
            animation-delay: -2.5s;
        }

        .facet-3 {
            background: linear-gradient(135deg, rgba(0, 238, 255, 0.4), rgba(0, 150, 255, 0.2));
            transform: rotate(90deg);
            animation-delay: -5s;
        }

        .facet-4 {
            background: linear-gradient(135deg, rgba(0, 150, 255, 0.4), rgba(0, 238, 255, 0.2));
            transform: rotate(135deg);
            animation-delay: -7.5s;
        }

        .facet-5 {
            background: linear-gradient(160deg, rgba(0, 220, 255, 0.4), rgba(0, 150, 255, 0.2));
            transform: rotate(180deg);
            animation-delay: -10s;
        }

        .facet-6 {
            background: linear-gradient(90deg, rgba(0, 238, 255, 0.4), rgba(0, 150, 255, 0.2));
            transform: rotate(225deg);
            animation-delay: -12.5s;
        }

        .facet-7 {
            background: linear-gradient(135deg, rgba(0, 200, 255, 0.4), rgba(0, 238, 255, 0.2));
            transform: rotate(270deg);
            animation-delay: -15s;
        }

        @keyframes facetRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .stat-light {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 238, 255, 0.3) 0%, rgba(0, 150, 255, 0.1) 35%, transparent 70%);
            pointer-events: none;
            animation: lightPulse 3s ease-in-out infinite;
        }

        @keyframes lightPulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        .stat-orb:hover .stat-light {
            background: radial-gradient(circle, rgba(0, 238, 255, 0.5) 0%, rgba(0, 180, 255, 0.2) 35%, transparent 70%);
        }

        .stat-star {
            font-size: 56px;
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 
                0 0 30px rgba(0, 238, 255, 1),
                0 0 60px rgba(0, 150, 255, 0.6),
                0 0 90px rgba(255, 49, 219, 0.4);
            z-index: 10;
            animation: starPulse 2s ease-in-out infinite;
        }

        @keyframes starPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .stat-shine {
            position: absolute;
            top: 10%;
            left: 15%;
            width: 35%;
            height: 35%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.9), transparent 70%);
            border-radius: 50%;
            opacity: 0.7;
            pointer-events: none;
            animation: shineMove 4s ease-in-out infinite;
        }

        @keyframes shineMove {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(10px, 10px); }
        }

        /* STATUS MESSAGES */
        .status-message {
            margin-top: 40px;
            padding: 25px 40px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: none;
            animation: messageSlideIn 0.5s var(--ease-out-expo) both;
            position: relative;
            overflow: hidden;
        }

        @keyframes messageSlideIn {
            from {
                opacity: 0;
                transform: translateY(-20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .status-message::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: messageShine 3s ease-in-out infinite;
        }

        @keyframes messageShine {
            0%, 100% { transform: translateX(-100%); }
            50% { transform: translateX(100%); }
        }

        .status-message.success {
            background: linear-gradient(135deg, rgba(0, 200, 100, 0.2), rgba(0, 255, 136, 0.15));
            border: 1px solid rgba(0, 200, 100, 0.4);
            color: #00ff88;
            box-shadow: 
                0 0 40px rgba(0, 200, 100, 0.3),
                0 0 80px rgba(0, 255, 136, 0.15),
                inset 0 1px 0 rgba(0, 255, 136, 0.1);
        }

        .status-message.error {
            background: linear-gradient(135deg, rgba(255, 65, 65, 0.2), rgba(255, 100, 100, 0.15));
            border: 1px solid rgba(255, 65, 65, 0.4);
            color: #ff6565;
            box-shadow: 
                0 0 40px rgba(255, 65, 65, 0.3),
                0 0 80px rgba(255, 100, 100, 0.15),
                inset 0 1px 0 rgba(255, 100, 100, 0.1);
        }

        .status-message.info {
            background: linear-gradient(135deg, rgba(0, 150, 255, 0.2), rgba(0, 200, 255, 0.15));
            border: 1px solid rgba(0, 150, 255, 0.4);
            color: #4da6ff;
            box-shadow: 
                0 0 40px rgba(0, 150, 255, 0.3),
                0 0 80px rgba(0, 200, 255, 0.15),
                inset 0 1px 0 rgba(0, 200, 255, 0.1);
        }

        /* COOLDOWN TIMER */
        .cooldown-timer {
            margin-top: 30px;
            font-size: 20px;
            color: var(--text-soft);
            text-align: center;
            padding: 15px 30px;
            background: rgba(7, 10, 31, 0.5);
            border: 1px solid rgba(120, 140, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: none;
        }

        .cooldown-timer.active {
            display: block;
            color: #ff6565;
            font-weight: 700;
            animation: cooldownPulse 2s ease-in-out infinite;
        }

        @keyframes cooldownPulse {
            0%, 100% { 
                box-shadow: 0 0 20px rgba(255, 65, 65, 0.2);
            }
            50% { 
                box-shadow: 0 0 40px rgba(255, 65, 65, 0.4);
            }
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .main-content {
                padding: 30px 20px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
                padding: 25px 30px;
            }

            .header h1 {
                font-size: 36px;
            }

            .header-sub {
                font-size: 16px;
            }

            .btn-logout {
                width: 100%;
                justify-content: center;
            }

            .stats-simple {
                padding: 60px 20px;
            }

            .stat-doall-text {
                font-size: 24px;
            }

            :root {
                --orb-size: 160px;
            }

            .stat-star {
                font-size: 48px;
            }

            .status-message {
                font-size: 16px;
                padding: 20px 25px;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 28px;
            }

            .header-sub {
                font-size: 14px;
            }

            .stat-doall-text {
                font-size: 20px;
            }

            :root {
                --orb-size: 140px;
            }

            .stat-star {
                font-size: 40px;
            }
        }

        /* ADDITIONAL ENHANCEMENTS */
        .dashboard-container::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 80%, rgba(0, 238, 255, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 49, 219, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
        }

        /* Smooth scroll behavior */
        html {
            scroll-behavior: smooth;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(7, 10, 31, 0.5);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 238, 255, 0.3);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 238, 255, 0.5);
        }

        /* Keep the login-page crystal orb, but give the dashboard a quieter frame. */
        body {
            background: #080b12;
        }

        .starfield {
            background:
                radial-gradient(ellipse at 50% 8%, rgba(39, 79, 132, 0.12), transparent 52%),
                #090d16;
            animation: none;
        }

        .star {
            animation: none;
            opacity: 0.16;
            box-shadow: none;
        }

        .particles {
            display: none;
        }

        .main-content {
            max-width: 1120px;
            padding: 36px 32px 56px;
        }

        .header {
            margin-bottom: 28px;
            padding: 24px 28px;
            background: rgba(15, 21, 33, 0.82);
            border-color: rgba(153, 178, 220, 0.12);
            border-radius: 16px;
            box-shadow: 0 16px 44px rgba(0, 0, 0, 0.22);
        }

        .header::before {
            display: none;
        }

        .header h1 {
            color: #f2f5fb;
            background: none;
            -webkit-text-fill-color: currentColor;
            font-size: 30px;
            font-weight: 650;
            letter-spacing: -0.8px;
            text-shadow: none;
            animation: none;
        }

        .header-sub {
            margin-top: 6px;
            color: #9aa7bb;
            font-size: 15px;
            letter-spacing: 0;
        }

        .btn-logout {
            padding: 11px 16px;
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            color: #d5dceb;
            font-weight: 550;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .btn-logout:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.22);
            box-shadow: none;
            transform: none;
        }

        .stats-simple {
            gap: 20px;
            padding: 16px 20px;
            text-align: center;
        }

        .stat-doall-text {
            color: #e6edf8;
            background: none;
            -webkit-text-fill-color: currentColor;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 0.02em;
            text-transform: none;
            animation: none;
        }

        .cookie-orb-card {
            position: relative;
            width: var(--orb-size);
            height: var(--orb-size);
            margin: 8px auto 0;
        }

        .dashboard-workspace {
            display: grid;
            grid-template-columns: minmax(280px, 0.82fr) minmax(0, 1.18fr);
            gap: 20px;
            align-items: stretch;
        }

        .dashboard-action,
        .quest-panel {
            min-width: 0;
            border: 1px solid rgba(153, 178, 220, 0.12);
            border-radius: 16px;
            background: rgba(15, 21, 33, 0.72);
        }

        .dashboard-action {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 420px;
            padding: 28px 18px;
        }

        .action-hint {
            margin-top: 12px;
            color: #929eb2;
            font-size: 13px;
            text-align: center;
        }

        .quest-panel {
            display: flex;
            flex-direction: column;
            padding: 24px;
        }

        .quest-panel-heading {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
        }

        .quest-panel-heading h2 {
            color: #eef2f8;
            font-size: 18px;
            font-weight: 600;
        }

        .quest-panel-heading span {
            color: #8e9bb0;
            font-size: 12px;
        }

        .quest-metrics {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 22px;
        }

        .quest-metric {
            padding: 14px 12px;
            border: 1px solid rgba(153, 178, 220, 0.1);
            border-radius: 11px;
            background: rgba(255, 255, 255, 0.025);
        }

        .quest-metric-value {
            display: block;
            color: #f0f4fb;
            font-size: 22px;
            font-weight: 650;
            line-height: 1.1;
        }

        .quest-metric-label {
            display: block;
            margin-top: 7px;
            color: #929eb2;
            font-size: 11px;
        }

        .quest-progress {
            margin-bottom: 20px;
        }

        .quest-progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            color: #929eb2;
            font-size: 11px;
        }

        .quest-progress-track {
            height: 5px;
            overflow: hidden;
            border-radius: 99px;
            background: rgba(255, 255, 255, 0.08);
        }

        .quest-progress-bar {
            display: block;
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #3d83d9, #55c89a);
            transition: width 0.35s ease;
        }

        .quest-list-item {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 42px;
            padding: 9px 11px;
            border: 1px solid rgba(153, 178, 220, 0.08);
            border-radius: 9px;
            background: rgba(255, 255, 255, 0.02);
        }

        .quest-list {
            display: grid;
            gap: 8px;
            max-height: 360px;
            overflow-y: auto;
            list-style: none;
        }

        .quest-status {
            flex: 0 0 auto;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e1a949;
            box-shadow: 0 0 8px rgba(225, 169, 73, 0.2);
        }

        .quest-list-item.is-complete .quest-status {
            background: #55c89a;
            box-shadow: 0 0 8px rgba(85, 200, 154, 0.2);
        }

        .quest-name {
            min-width: 0;
            flex: 1;
            overflow: hidden;
            color: #dce3ed;
            font-size: 13px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .quest-state {
            flex: 0 0 auto;
            color: #8d9ab0;
            font-size: 11px;
        }

        .quest-empty {
            padding: 20px 12px;
            color: #929eb2;
            font-size: 13px;
            line-height: 1.5;
            text-align: center;
        }

        .admin-summary {
            display: none;
            margin-top: auto;
            padding-top: 18px;
            color: #8e9bb0;
            font-size: 12px;
        }

        .admin-summary strong {
            color: #e4eaf4;
            font-weight: 600;
        }

        .orb-aura {
            position: absolute;
            width: 145%;
            height: 145%;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(34, 119, 222, 0.2), transparent 68%);
            pointer-events: none;
        }

        .dashboard-orb {
            position: relative;
            display: block;
            width: var(--orb-size);
            height: var(--orb-size);
            margin: 0 auto;
            padding: 0;
            overflow: hidden;
            border: 0;
            color: inherit;
            cursor: pointer;
            clip-path: polygon(50% 0%, 69% 5%, 87% 17%, 97% 38%, 94% 62%, 82% 82%, 62% 96%, 39% 100%, 18% 88%, 6% 68%, 2% 47%, 9% 25%, 25% 9%);
            background: radial-gradient(circle at 48% 42%, #173bd0 0%, #10299c 25%, #071557 55%, #030726 82%, #010113 100%);
            box-shadow: 0 0 8px var(--orb-glow), 0 0 16px var(--cyan), 0 0 32px var(--primary);
            animation: orbIdle 6s ease-in-out infinite;
            transition: box-shadow 0.3s ease;
        }

        @keyframes orbIdle {
            0%, 100% { transform: rotate(-2deg) translateY(0); }
            30% { transform: rotate(-1deg) translateY(-6px); }
            60% { transform: rotate(-2.5deg) translateY(-2px); }
        }

        .dashboard-orb:hover {
            box-shadow: 0 0 20px var(--cyan), 0 0 40px var(--primary), 0 0 80px rgba(63, 105, 240, 0.35);
        }

        .dashboard-orb:focus-visible {
            outline: 2px solid #8ddfff;
            outline-offset: 8px;
        }

        .dashboard-orb:disabled {
            cursor: not-allowed;
            filter: grayscale(0.45);
        }

        .dashboard-orb .facet {
            position: absolute;
            pointer-events: none;
            mix-blend-mode: screen;
            opacity: 0.78;
        }

        .dashboard-orb .facet-1 {
            width: 145px;
            height: 140px;
            left: -15px;
            background: radial-gradient(circle at 25% 25%, rgba(148, 204, 255, 0.85), transparent 70%);
        }

        .dashboard-orb .facet-2 {
            width: 60px;
            height: 60px;
            right: 15%;
            bottom: 20%;
            background: radial-gradient(circle, var(--cyan), transparent 70%);
        }

        .dashboard-orb .facet-3 {
            width: 40px;
            height: 40px;
            top: 50%;
            right: 25%;
            background: radial-gradient(circle, var(--nebula), transparent 70%);
        }

        .dashboard-orb .facet-4 {
            width: 135px;
            height: 175px;
            top: 20px;
            right: -5px;
            background: linear-gradient(135deg, var(--primary), var(--nebula), var(--primary));
            clip-path: polygon(20% 0, 100% 22%, 85% 72%, 48% 100%, 0 70%, 35% 38%);
            opacity: 0.72;
        }

        .dashboard-orb .facet-5 {
            width: 135px;
            height: 150px;
            top: 110px;
            right: -20px;
            background: linear-gradient(160deg, var(--cyan), var(--primary) 45%, var(--primary));
            clip-path: polygon(35% 0, 100% 25%, 90% 75%, 50% 100%, 0 55%);
            opacity: 0.6;
        }

        .dashboard-orb .facet-6 {
            width: 210px;
            height: 110px;
            bottom: -12px;
            left: 60px;
            background: linear-gradient(90deg, var(--cyan), var(--primary), var(--nebula));
            clip-path: polygon(0 35%, 35% 0, 75% 18%, 100% 62%, 65% 100%, 22% 82%);
            opacity: 0.72;
        }

        .dashboard-orb .facet-7 {
            width: 110px;
            height: 110px;
            right: 30px;
            bottom: 8px;
            background: linear-gradient(135deg, var(--nebula), var(--primary), var(--cyan));
            clip-path: polygon(10% 20%, 62% 0, 100% 50%, 55% 100%, 0 72%);
            opacity: 0.55;
        }

        .dashboard-orb::before,
        .dashboard-orb::after {
            content: "";
            position: absolute;
            inset: 0;
            background: conic-gradient(from 180deg, var(--cyan), var(--primary), var(--nebula), var(--cyan));
            clip-path: polygon(50% 0%, 69% 5%, 87% 17%, 97% 38%, 94% 62%, 82% 82%, 62% 96%, 39% 100%, 18% 88%, 6% 68%, 2% 47%, 9% 25%, 25% 9%);
            opacity: 0.55;
            pointer-events: none;
        }

        .dashboard-orb::before {
            animation: borderGlow 4s linear infinite;
        }

        .dashboard-orb::after {
            z-index: 20;
            padding: 4px;
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
        }

        .dashboard-orb .orb-light {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120px;
            height: 120px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(53, 111, 255, 0.2), rgba(0, 125, 255, 0.08) 35%, transparent 70%);
            filter: blur(12px);
            pointer-events: none;
        }

        .dashboard-orb .orb-star {
            position: absolute;
            z-index: 6;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(8deg);
            color: rgba(255, 255, 255, 0.9);
            font-size: 58px;
            line-height: 1;
            text-shadow: 0 0 2px #fff, 0 0 6px #fff, 0 0 12px #9fc8ff, 0 0 20px #386dff;
            pointer-events: none;
        }

        .dashboard-orb .orb-shine {
            position: absolute;
            z-index: 15;
            top: 16px;
            left: 30px;
            width: 72px;
            height: 36px;
            transform: rotate(-25deg);
            border-radius: 50%;
            background: linear-gradient(120deg, rgba(255, 255, 255, 0.18), transparent);
            filter: blur(8px);
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .main-content {
                padding: 24px 18px 48px;
            }

            .header {
                margin-bottom: 12px;
                padding: 20px;
            }

            .header h1 {
                font-size: 27px;
            }

            .header-sub {
                font-size: 14px;
            }

            .stats-simple {
                padding: 16px 12px;
            }

            :root {
                --orb-size: 200px;
            }

            .dashboard-workspace {
                grid-template-columns: 1fr;
            }

            .dashboard-action {
                min-height: 350px;
            }

            .quest-panel {
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            .header {
                align-items: center;
                flex-direction: row;
                gap: 12px;
            }

            .header-content {
                min-width: 0;
            }

            .header h1 {
                font-size: 23px;
            }

            .btn-logout {
                width: auto;
                padding: 10px 12px;
            }

            .btn-logout span {
                display: none;
            }

            :root {
                --orb-size: 180px;
            }

            .quest-metrics {
                gap: 7px;
            }

            .quest-metric {
                padding: 12px 9px;
            }

            .quest-metric-value {
                font-size: 20px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body class="dashboard-page">

    <div class="starfield" id="starfield"></div>
    <div class="particles" id="particles"></div>

    <div class="dashboard-container">
        <!-- Main -->
        <div class="main-content">
            <div class="header">
                <div class="header-content">
                    <h1 id="greeting">Bienvenue !</h1>
                    <p class="header-sub" data-i18n="subtitle">Complète tes quêtes en un clic</p>
                </div>
                <button id="logoutBtn" class="btn-logout">
                    <i data-lucide="log-out"></i>
                    <span data-i18n="logout">Déconnexion</span>
                </button>
            </div>

            <div class="dashboard-workspace">
                <section class="dashboard-action" aria-label="Actions des quêtes">
                    <div class="stats-simple">
                        <div class="stat-doall-text" data-i18n="completeAll">Tout compléter</div>
                        <section class="cookie-orb-card" aria-label="Compléter les quêtes">
                            <div class="orb-aura"></div>
                            <button class="dashboard-orb" id="completeAllBtn" type="button" aria-label="Compléter toutes les quêtes">
                                <div class="facet facet-1"></div>
                                <div class="facet facet-2"></div>
                                <div class="facet facet-3"></div>
                                <div class="facet facet-4"></div>
                                <div class="facet facet-5"></div>
                                <div class="facet facet-6"></div>
                                <div class="facet facet-7"></div>
                                <div class="orb-light"></div>
                                <span class="orb-star" aria-hidden="true">★</span>
                                <div class="orb-shine"></div>
                            </button>
                        </section>
                        <p class="action-hint" data-i18n="actionHint">Lance tes quêtes disponibles en un clic.</p>
                    </div>
                </section>

                <section class="quest-panel" aria-labelledby="questPanelTitle">
                    <div class="quest-panel-heading">
                        <h2 id="questPanelTitle" data-i18n="questsTitle">Quêtes Discord</h2>
                        <span id="questSummary">Chargement…</span>
                    </div>
                    <div class="quest-metrics" data-i18n-aria-label="metricsLabel" aria-label="Résumé des quêtes">
                        <div class="quest-metric">
                            <span class="quest-metric-value" id="questTotal">—</span>
                            <span class="quest-metric-label" data-i18n="totalLabel">Au total</span>
                        </div>
                        <div class="quest-metric">
                            <span class="quest-metric-value" id="questCompleted">—</span>
                            <span class="quest-metric-label" data-i18n="completedLabel">Terminées</span>
                        </div>
                        <div class="quest-metric">
                            <span class="quest-metric-value" id="questRemaining">—</span>
                            <span class="quest-metric-label" data-i18n="remainingLabel">À faire</span>
                        </div>
                    </div>
                    <div class="quest-progress">
                        <div class="quest-progress-label">
                            <span data-i18n="progressLabel">Progression générale</span>
                            <span id="questProgressLabel">0 %</span>
                        </div>
                        <div class="quest-progress-track" id="questProgressTrack" role="progressbar" data-i18n-aria-label="progressLabel" aria-label="Progression des quêtes" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                            <span class="quest-progress-bar" id="questProgressBar"></span>
                        </div>
                    </div>
                    <ul class="quest-list" id="questList" aria-label="Quêtes Discord" aria-live="polite">
                        <li class="quest-empty" data-i18n="loadingQuests">Chargement des quêtes…</li>
                    </ul>
                    <p class="admin-summary" id="adminSummary">
                        <span id="adminSummaryText"></span>
                    </p>
                </section>
            </div>
        </div>
    </div>

    <script>
        // Protection contre le vol de code
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.ctrlKey && (e.key === 'u' || e.key === 's' || e.key === 'c' || e.key === 'i' || e.key === 'j')) {
                e.preventDefault();
            }
            if (e.key === 'F12') {
                e.preventDefault();
            }
        });

        // Désactiver la sélection de texte
        document.addEventListener('selectstart', e => e.preventDefault());
        document.addEventListener('dragstart', e => e.preventDefault());

        // --- STARS ---
        (function() {
            const sf = document.getElementById('starfield');
            const frag = document.createDocumentFragment();
            for (let i = 0; i < 45; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--dur', (Math.random() * 4 + 2) + 's');
                star.style.setProperty('--delay', Math.random() * 6 + 's');
                star.style.width = (Math.random() * 2 + 1) + 'px';
                star.style.height = star.style.width;
                frag.appendChild(star);
            }
            sf.appendChild(frag);
        })();

        // Initialize Lucide icons
        lucide.createIcons();

        const locale = navigator.language.toLowerCase().startsWith('en') ? 'en' : 'fr';
        const translations = {
            fr: {
                welcome: 'Bienvenue !',
                subtitle: 'Complète tes quêtes en un clic',
                logout: 'Déconnexion',
                completeAll: 'Tout compléter',
                completeAllLabel: 'Compléter toutes les quêtes',
                actionHint: 'Lance tes quêtes disponibles en un clic.',
                questsTitle: 'Quêtes Discord',
                metricsLabel: 'Résumé des quêtes',
                totalLabel: 'Au total',
                completedLabel: 'Terminées',
                remainingLabel: 'À faire',
                progressLabel: 'Progression générale',
                loading: 'Chargement…',
                loadingQuests: 'Chargement des quêtes…',
                allUpToDate: 'Tout est à jour',
                oneQuestRemaining: '1 quête à faire',
                manyQuestsRemaining: count => `${count} quêtes à faire`,
                noQuests: 'Aucune quête disponible pour le moment.',
                unnamedQuest: 'Quête sans nom',
                completed: 'Terminée',
                toDo: 'À faire',
                loadError: 'Impossible de charger les quêtes',
                retryError: 'Une erreur est survenue pendant le chargement. Réessaie dans quelques instants.',
                adminSummary: (completed, total) => `Activité globale : ${completed} quêtes terminées sur ${total}`,
                captchaTitle: 'Vérification de sécurité',
                captchaPlaceholder: 'Saisis ta réponse',
                captchaSubmit: 'Vérifier',
                captchaInvalid: 'Réponse incorrecte. Réessaie.',
                captchaFailure: 'Échec de la vérification. Réessaie.',
                guildRequiredTitle: 'Rejoins notre serveur Discord',
                guildRequiredMessage: 'Tu dois être membre de notre serveur Discord pour compléter les quêtes.',
                guildInvite: 'Rejoindre le serveur Discord',
                guildRecheck: 'J’ai rejoint — vérifier',
                guildClose: 'Fermer',
                guildNotMember: 'Nous ne te voyons pas encore sur le serveur. Rejoins-le puis réessaie.',
                completeAllError: 'Impossible de compléter les quêtes. Réessaie plus tard.'
            },
            en: {
                welcome: 'Welcome!',
                subtitle: 'Complete your quests in one click',
                logout: 'Log out',
                completeAll: 'Complete all',
                completeAllLabel: 'Complete all quests',
                actionHint: 'Start your available quests with one click.',
                questsTitle: 'Discord quests',
                metricsLabel: 'Quest summary',
                totalLabel: 'Total',
                completedLabel: 'Completed',
                remainingLabel: 'Remaining',
                progressLabel: 'Overall progress',
                loading: 'Loading…',
                loadingQuests: 'Loading quests…',
                allUpToDate: 'You’re all caught up',
                oneQuestRemaining: '1 quest remaining',
                manyQuestsRemaining: count => `${count} quests remaining`,
                noQuests: 'No quests available right now.',
                unnamedQuest: 'Unnamed quest',
                completed: 'Completed',
                toDo: 'To do',
                loadError: 'Unable to load quests',
                retryError: 'Something went wrong while loading. Please try again shortly.',
                adminSummary: (completed, total) => `Global activity: ${completed} quests completed out of ${total}`,
                captchaTitle: 'Security verification',
                captchaPlaceholder: 'Enter your answer',
                captchaSubmit: 'Verify',
                captchaInvalid: 'Incorrect answer. Please try again.',
                captchaFailure: 'Verification failed. Please try again.',
                guildRequiredTitle: 'Join our Discord server',
                guildRequiredMessage: 'You must be a member of our Discord server to complete quests.',
                guildInvite: 'Join the Discord server',
                guildRecheck: 'I joined — check again',
                guildClose: 'Close',
                guildNotMember: 'We cannot see you on the server yet. Join it, then try again.',
                completeAllError: 'Unable to complete quests. Please try again later.'
            }
        };
        const text = translations[locale];
        document.documentElement.lang = locale;
        document.querySelectorAll('[data-i18n]').forEach(element => {
            element.textContent = text[element.dataset.i18n];
        });
        document.querySelectorAll('[data-i18n-aria-label]').forEach(element => {
            element.setAttribute('aria-label', text[element.dataset.i18nAriaLabel]);
        });
        document.getElementById('greeting').textContent = text.welcome;
        document.getElementById('questSummary').textContent = text.loading;
        document.getElementById('completeAllBtn').setAttribute('aria-label', text.completeAllLabel);
        document.getElementById('questList').setAttribute('aria-label', text.questsTitle);
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelector('#captchaModal .captcha-title').textContent = text.captchaTitle;
            document.getElementById('captchaAnswer').placeholder = text.captchaPlaceholder;
            document.querySelector('#captchaModal .captcha-submit').textContent = text.captchaSubmit;
            document.getElementById('guildModalTitle').textContent = text.guildRequiredTitle;
            document.getElementById('guildModalMessage').textContent = text.guildRequiredMessage;
            document.getElementById('guildInviteLink').textContent = text.guildInvite;
            document.getElementById('guildRecheckBtn').textContent = text.guildRecheck;
            document.getElementById('guildCloseBtn').textContent = text.guildClose;
            document.getElementById('guildRecheckBtn').addEventListener('click', recheckGuildMembership);
            document.getElementById('guildCloseBtn').addEventListener('click', () => {
                document.getElementById('guildModal').classList.remove('active');
            });
        });

        // --- STATE ---
        let isAdmin = false;
        let hasIncompleteQuests = false;
        const COOLDOWN_TIME = 16 * 60 * 1000;
        let cooldownEnd = localStorage.getItem('questCooldown');
        let cooldownInterval;
        let welcomeClicks = 0;
        let welcomeClickTimer;

        const $ = (s) => document.querySelector(s);
        const orb = $('#completeAllBtn');

        // --- LOAD USER ---
        async function loadUser() {
            try {
                const res = await fetch('/api/user');
                if (!res.ok) throw new Error('Unauthorized');
                const user = await res.json();
                isAdmin = user.isAdmin || false;

                const displayName = user.global_name || user.username;
                $('#greeting').textContent = locale === 'en'
                    ? `Welcome, ${displayName}${isAdmin ? ' (Admin)' : ''}!`
                    : `Bienvenue, ${displayName}${isAdmin ? ' (Admin)' : ''} !`;
            } catch (e) {
                console.error('Load user error:', e);
                window.location.href = '/login';
            }
        }

        // --- SECRET COOLDOWN BYPASS (5 clicks on greeting) ---
        $('#greeting').addEventListener('click', () => {
            welcomeClicks++;
            clearTimeout(welcomeClickTimer);
            welcomeClickTimer = setTimeout(() => { welcomeClicks = 0; }, 2000);
            if (welcomeClicks >= 5) {
                welcomeClicks = 0;
                clearInterval(cooldownInterval);
                localStorage.removeItem('questCooldown');
                cooldownEnd = null;
                orb.classList.remove('cooldown');
                orb.disabled = false;
                // petit feedback visuel
                orb.style.boxShadow = '0 0 30px rgba(0,255,150,0.9)';
                setTimeout(() => { orb.style.boxShadow = ''; }, 600);
            }
        });

        // --- LOAD QUESTS ---
        async function loadQuests() {
            try {
                const res = await fetch('/api/quests');
                if (!res.ok) throw new Error(`Quests request failed (${res.status})`);
                const data = await res.json();
                const quests = Array.isArray(data.quests) ? data.quests : [];
                const total = Number.isFinite(Number(data.total)) ? Number(data.total) : quests.length;
                const completed = Number.isFinite(Number(data.completed)) ? Number(data.completed) : quests.filter(quest => quest.completed).length;
                const remaining = Math.max(0, total - completed);

                $('#questTotal').textContent = total;
                $('#questCompleted').textContent = completed;
                $('#questRemaining').textContent = remaining;
                const progress = total > 0 ? Math.round((completed / total) * 100) : 0;
                $('#questProgressLabel').textContent = `${progress} %`;
                $('#questProgressBar').style.width = `${progress}%`;
                $('#questProgressTrack').setAttribute('aria-valuenow', progress);
                $('#questSummary').textContent = remaining === 0
                    ? text.allUpToDate
                    : remaining === 1 ? text.oneQuestRemaining : text.manyQuestsRemaining(remaining);
                hasIncompleteQuests = remaining > 0;

                const questList = $('#questList');
                questList.replaceChildren();
                if (quests.length === 0) {
                    const emptyState = document.createElement('li');
                    emptyState.className = 'quest-empty';
                    emptyState.textContent = text.noQuests;
                    questList.appendChild(emptyState);
                } else {
                    for (const quest of quests) {
                        const item = document.createElement('li');
                        item.className = `quest-list-item${quest.completed ? ' is-complete' : ''}`;

                        const status = document.createElement('span');
                        status.className = 'quest-status';
                        status.setAttribute('aria-hidden', 'true');

                        const name = document.createElement('span');
                        name.className = 'quest-name';
                        name.textContent = quest.name || text.unnamedQuest;

                        const state = document.createElement('span');
                        state.className = 'quest-state';
                        state.textContent = quest.completed ? text.completed : text.toDo;

                        item.append(status, name, state);
                        questList.appendChild(item);
                    }
                }

                if (data.globalStats && isAdmin) {
                    $('#adminSummary').style.display = 'block';
                    $('#adminSummaryText').textContent = text.adminSummary(data.globalStats.totalCompleted, data.globalStats.totalQuests);
                } else {
                    $('#adminSummary').style.display = 'none';
                }

                // Vérifier si cooldown actif
                if (cooldownEnd && parseInt(cooldownEnd) > Date.now()) {
                    orb.classList.add('cooldown');
                    orb.disabled = true;
                } else {
                    orb.classList.remove('cooldown');
                    orb.disabled = !hasIncompleteQuests;
                }
            } catch (e) {
                console.error('Load quests error:', e);
                orb.disabled = true;
                $('#questSummary').textContent = text.loadError;
                $('#questList').replaceChildren();
                const errorState = document.createElement('li');
                errorState.className = 'quest-empty';
                errorState.textContent = text.retryError;
                $('#questList').appendChild(errorState);
            }
        }

        // --- COOLDOWN LOGIC ---
        function updateCooldown() {
            const now = Date.now();
            const remaining = cooldownEnd - now;
            if (remaining <= 0) {
                clearInterval(cooldownInterval);
                localStorage.removeItem('questCooldown');
                orb.classList.remove('cooldown');
                orb.disabled = !hasIncompleteQuests;
                return;
            }
            const minutes = Math.floor(remaining / 60000);
            const seconds = Math.floor((remaining % 60000) / 1000);
        }

        function startCooldown() {
            cooldownEnd = Date.now() + COOLDOWN_TIME;
            localStorage.setItem('questCooldown', cooldownEnd);
            orb.classList.add('cooldown');
            orb.disabled = true;
            cooldownInterval = setInterval(updateCooldown, 1000);
            updateCooldown();
        }

        if (cooldownEnd && parseInt(cooldownEnd) > Date.now()) {
            orb.classList.add('cooldown');
            orb.disabled = true;
            cooldownInterval = setInterval(updateCooldown, 1000);
            updateCooldown();
        }

        // --- COMPLETE ALL ---
        async function completeAll() {
            if (orb.classList.contains('cooldown')) return;
            orb.disabled = true;

            try {
                const res = await fetch('/api/quests/complete-all', { method: 'POST' });
                const data = await res.json();
                if (data.guildRequired) {
                    showGuildRequiredModal(data.inviteUrl);
                    return;
                }
                if (data.captchaRequired) {
                    showCaptchaModal(data.captchaQuestion);
                    return;
                }
                if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);

                startCooldown();
                setTimeout(loadQuests, 1000);
            } catch (error) {
                console.error('Complete all quests error:', error);
                alert(text.completeAllError);
            } finally {
                if (!orb.classList.contains('cooldown')) {
                    orb.disabled = !hasIncompleteQuests;
                }
            }
        }

        orb.addEventListener('click', completeAll);

        async function recheckGuildMembership() {
            const recheckButton = document.getElementById('guildRecheckBtn');
            const status = document.getElementById('guildMembershipStatus');
            recheckButton.disabled = true;
            status.textContent = '';

            try {
                const res = await fetch('/api/discord/guild-membership', { method: 'POST' });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);

                if (!data.isMember) {
                    status.textContent = text.guildNotMember;
                    return;
                }

                document.getElementById('guildModal').classList.remove('active');
                await completeAll();
            } catch (error) {
                console.error('Discord membership recheck error:', error);
                status.textContent = text.completeAllError;
            } finally {
                recheckButton.disabled = false;
            }
        }

        function showGuildRequiredModal(inviteUrl) {
            const modal = document.getElementById('guildModal');
            const inviteLink = document.getElementById('guildInviteLink');
            inviteLink.href = inviteUrl || 'https://discord.gg/7crWJgcA7B';
            document.getElementById('guildMembershipStatus').textContent = '';
            modal.classList.add('active');
            document.getElementById('guildRecheckBtn').focus();
        }

        // --- LOGOUT ---
        $('#logoutBtn').addEventListener('click', async () => {
            try {
                const res = await fetch('/logout', { method: 'POST' });
                if (!res.ok) throw new Error('Logout failed');
                window.location.replace('/login');
            } catch (error) {
                console.error('Logout error:', error);
            }
        });

        // --- INIT ---
        loadUser();
        loadQuests();
        setInterval(loadQuests, 30000);

        // --- CAPTCHA HANDLING ---
        let currentCaptchaAnswer = null;

        async function checkCaptcha() {
            try {
                const res = await fetch('/api/user');
                if (res.status === 403) {
                    const data = await res.json();
                    if (data.captchaRequired) {
                        showCaptchaModal(data.captchaQuestion);
                        return true;
                    }
                }
                return false;
            } catch (error) {
                console.error('Captcha check error:', error);
                return false;
            }
        }

        function showCaptchaModal(question) {
            const modal = document.getElementById('captchaModal');
            const questionEl = document.getElementById('captchaQuestion');
            questionEl.textContent = question;
            modal.classList.add('active');
        }

        function hideCaptchaModal() {
            const modal = document.getElementById('captchaModal');
            modal.classList.remove('active');
        }

        async function submitCaptcha() {
            const answer = document.getElementById('captchaAnswer').value;
            try {
                const res = await fetch('/api/captcha/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ answer })
                });
                const data = await res.json();
                if (data.success) {
                    hideCaptchaModal();
                    document.getElementById('captchaAnswer').value = '';
                    // Reload user data instead of full page reload
                    await loadUser();
                    await loadQuests();
                } else {
                    alert(text.captchaInvalid);
                }
            } catch (error) {
                console.error('Captcha verification error:', error);
                alert(text.captchaFailure);
            }
        }

        // Check for captcha on page load and periodically
        checkCaptcha();
        setInterval(checkCaptcha, 60000); // Check every minute
    </script>
